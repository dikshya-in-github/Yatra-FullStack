spring.application.name=Yatra
#server.port=9090   #=>Yeslay port change garxa. If 8080 already use vanyo vane yo code lekhne
#9090 ma khulena vane process kill garna parxa

# Real credentials live in application-local.properties (git-ignored, "local" profile).
# Environment variables override the placeholders below; application-local.properties
# overrides both on this machine.
spring.profiles.active=local

#MYSQL Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#DB name is `yatra`, NOT `test`: TiDB's default `test` database is shared with the
#teacher's SpringWeb demo tables (user_tbl, vir_img_table, ...). Never point
#this back at `test`.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:4000/yatra}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

#JPA Configuration
#validate, NOT update: Hibernate must never mutate the schema. The DDL is owned
explicitly in src/main/resources/db/schema.sql. Editing an entity
without updating that file now FAILS AT STARTUP instead of silently ALTERing the
live cloud database — and TiDB's ALTER TABLE support is narrower than MySQL's,
so silent diffs were a real hazard.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#The schema is applied deliberately by hand, never at startup — the app must not
#mutate its own schema. To auto-bootstrap a FRESH database instead, uncomment
these two (schema.sql is idempotent, so it is a no-op on an existing schema):
#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:db/schema.sql

#Abandoned-hold expiry (the sweep that ends a 15-minute hold nobody paid for).
#A booking holds its seats from the moment it is created, before the gateway is called,
#so an abandoned PENDING row would otherwise pin those seats for ever and availability
#(seatCapacity - COUNT(BOOKED seats)) would keep reporting them as sold.
#expiry-minutes = how old a hold must be. 15 is the window the booking wizard's own
timer promises the customer; POST /api/admin/bookings/expire-holds uses the same value
#when its `minutes` parameter is omitted.
#sweep.enabled  = whether the background job runs at all. FALSE BY DEFAULT ON PURPOSE:
#the test suite boots 26 @SpringBootTest contexts against the LIVE schema, and a
#@Scheduled method needs no request or token and DELETES rows — the same hazard that
#made seeding an explicit admin endpoint instead of a CommandLineRunner. Arm it with
#HOLD_SWEEP_ENABLED=true (or -Dyatra.hold.sweep.enabled=true) for a real run.
#interval-ms    = fixed delay between sweeps: the next run starts this long AFTER the
#previous one finished, so a slow sweep cannot pile up behind itself.
yatra.hold.expiry-minutes=${HOLD_EXPIRY_MINUTES:15}
yatra.hold.sweep.enabled=${HOLD_SWEEP_ENABLED:false}
yatra.hold.sweep.interval-ms=${HOLD_SWEEP_INTERVAL_MS:60000}
yatra.hold.sweep.initial-delay-ms=${HOLD_SWEEP_INITIAL_DELAY_MS:60000}

#JWT Configuration — stateless auth.
#The real secret lives in application-local.properties (git-ignored), or JWT_SECRET.
#HS256 requires a key of at least 32 bytes, so JwtUtil FAILS FAST at startup rather
#than silently signing with a weak/absent key. Never commit a real secret here.
yatra.jwt.secret=${JWT_SECRET:}
yatra.jwt.expiry-minutes=480

#Cloudinary — destination images ONLY (rule 3's hybrid split).
#Airline logos stay in the database as a BLOB; a destination image lives on
#Cloudinary's CDN and the `destination` row keeps only `image_url` +
#`image_public_id`. Real values live in application-local.properties (git-ignored)
#or the environment — never here.
#Leaving these blank is a SUPPORTED state, not a broken one: the destination CRUD
#endpoints work normally and only POST /api/admin/destinations/image answers
#503 IMAGE_UPLOAD_NOT_CONFIGURED. That is deliberate — a bean that needed these
to construct would stop every @SpringBootTest context from loading (see
#Config/CloudinaryConfig).
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:yatra/destinations}

#eSewa ePay v2 (fix-plan §10) — the REAL gateway flow.
#
#How it works: POST /api/payments/initiate stores a transaction_uuid on the payment
#row and answers gatewayRedirect = /api/payments/esewa/checkout/{bookingId}. That
#endpoint signs the eight required fields with HMAC-SHA256 over
#  total_amount=<amount>,transaction_uuid=<uuid>,product_code=<code>
#Base64-encodes the result and serves a page that POSTs itself to form-url. The
#customer then leaves this site entirely — eSewa's own hosted pages do the login,
#the OTP and the balance display — and comes back to success-url / failure-url with
a Base64 `?data=` parameter, which the callback verifies (signature, then eSewa's
#status API) before anything is confirmed. The four esewaLogin/Otp/Balance/Confirm
#pages are no longer part of this flow; they remain on disk, unused, for the demo.
#
#form-url / status-url point at eSewa's UAT (sandbox) environment by VALUE, not by a
#flag: going live is editing these two lines plus product-code. Both are safe to
#commit — they are published endpoints, not credentials.
yatra.esewa.form-url=${ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
yatra.esewa.status-url=${ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}
#EPAYTEST is eSewa's sandbox product code; a live merchant replaces it.
yatra.esewa.product-code=${ESEWA_PRODUCT_CODE:EPAYTEST}
#The signing key. Blank by default, and blank is a SUPPORTED state exactly as the
#Cloudinary credentials are: the app boots, every other payment endpoint works, and
#only GET /api/payments/esewa/checkout/{id} answers 503 ESEWA_NOT_CONFIGURED.
#The UAT key is eSewa's own published sandbox secret (`8gBm/:&EnhH.1/q`), so it is not
#a Yatra secret in the confidentiality sense — but the habit is the point: a live
#merchant key is a real credential, and this file is committed. Set it in
#application-local.properties (git-ignored) or the environment, never here.
yatra.esewa.secret-key=${ESEWA_SECRET_KEY:}

#Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Other properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# TLS , port 587
spring.mail.properties.mail.smtp.starttls.enable=true

#Registration confirmation email (Roadmap Phase 11) — the switch Service/MailService checks.
#true  = POST /api/auth/register sends the "your account is ready" message.
#false = no attempt is made at all. This is what the TEST SUITE sets (AuthFlowTest), and
#        it is not cosmetic: MAIL_USERNAME/MAIL_PASSWORD are real on this machine, so
#        without the switch every test that registers an account would send real Gmail
#        traffic to a fake address. A demo or a CI run with no mailbox sets it too.
#Service/MailService checks this BEFORE it attempts a connection, so a disabled or
#unconfigured sender is skipped rather than tried and left to time out (5s per attempt).
yatra.mail.enabled=${MAIL_ENABLED:true}

